$kind: http-request
url: "{{baseUrl}}/bands/{{bandId}}"
method: GET
scripts:
  - type: afterResponse
    code: |-
      pm.test("Status is 200 OK", function () {
          pm.response.to.have.status(200);
      });

      pm.test("Band data is correct", function () {
          const band = pm.response.json();
          pm.expect(band.name).to.equal("Vakaro Aidas");
          pm.expect(band.membersCount).to.equal(4);
      });
    language: text/javascript
order: 3000
