$kind: http-request
url: "{{baseUrl}}/bands"
method: GET
scripts:
  - type: afterResponse
    code: |-
      pm.test("Status is 200 OK", function () {
          pm.response.to.have.status(200);
      });

      pm.test("List contains bands", function () {
          const body = pm.response.json();
          pm.expect(body._embedded.bands.length).to.be.above(0);
      });
    language: text/javascript
order: 2000
