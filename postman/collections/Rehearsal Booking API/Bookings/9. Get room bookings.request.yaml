$kind: http-request
url: "{{baseUrl}}/rooms/{{roomId}}/bookings"
method: GET
scripts:
  - type: afterResponse
    code: |-
      pm.test("Status is 200 OK", function () {
          pm.response.to.have.status(200);
      });

      pm.test("Room has one active booking", function () {
          const body = pm.response.json();
          pm.expect(body._embedded.bookings.length).to.equal(1);
      });
    language: text/javascript
order: 3000
