$kind: http-request
url: "{{baseUrl}}/rooms/{{roomId}}"
method: PUT
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "name": "{{roomName}}",
      "capacity": 6,
      "hourlyPrice": 15.00
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test("Status is 200 OK", function () {
          pm.response.to.have.status(200);
      });

      pm.test("Capacity is changed to 6", function () {
          const room = pm.response.json();
          pm.expect(room.capacity).to.equal(6);
      });
    language: text/javascript
order: 4000
