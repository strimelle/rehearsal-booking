$kind: http-request
url: "{{baseUrl}}/rooms"
method: POST
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "name": "Studija B",
      "capacity": 0,
      "hourlyPrice": 15.00
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test("Status is 400 Bad Request", function () {
          pm.response.to.have.status(400);
      });

      pm.test("Message explains the capacity rule", function () {
          const error = pm.response.json();
          pm.expect(error.message).to.include("Capacity must be at least 1");
      });
    language: text/javascript
order: 4000
